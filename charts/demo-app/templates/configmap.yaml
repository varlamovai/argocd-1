apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-html
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head><meta charset="utf-8"><title>{{ .Values.app.title }}</title></head>
    <body style="font-family: sans-serif; text-align: center; padding-top: 80px; background: {{ .Values.app.color }}; color: white;">
      <h1>{{ .Values.app.title }}</h1>
      <h2>Версия из Git: {{ .Values.app.version }}</h2>
      <p>Развернуто автоматически через Argo CD</p>
    </body>
    </html>